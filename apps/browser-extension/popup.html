<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindLoom Capture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 360px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #fafafa;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }

      .field {
        margin-bottom: 10px;
      }

      .label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        margin-bottom: 4px;
      }

      .value {
        word-break: break-all;
        line-height: 1.4;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #e0e0e0;
      }

      .toggle-label {
        font-weight: 500;
      }

      .switch {
        position: relative;
        width: 44px;
        height: 24px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: #ccc;
        border-radius: 24px;
        transition: background 0.2s;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }

      .switch input:checked + .slider {
        background: #2563eb;
      }

      .switch input:checked + .slider::before {
        transform: translateX(20px);
      }

      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }

      .status.on {
        color: #15803d;
      }

      .view-captures {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
      }

      .view-captures:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <h1>MindLoom Capture</h1>

    <div class="field">
      <span class="label">Tab ID</span>
      <div id="tab-id" class="value">—</div>
    </div>

    <div class="field">
      <span class="label">Title</span>
      <div id="tab-title" class="value">—</div>
    </div>

    <div class="field">
      <span class="label">URL</span>
      <div id="tab-url" class="value">—</div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Capture</span>
      <label class="switch">
        <input type="checkbox" id="capture-toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div id="capture-status" class="status">OFF</div>

    <div class="field" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e0e0e0;">
      <label class="label" for="api-base">API base</label>
      <input
        id="api-base"
        class="value"
        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px;"
        placeholder="http://localhost:8000"
      />
    </div>
    <div class="field">
      <label class="label" for="access-token">Access token</label>
      <textarea
        id="access-token"
        class="value"
        rows="3"
        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 11px; font-family: ui-monospace, monospace;"
        placeholder="Paste MindLoom access_token from web session"
      ></textarea>
      <button
        type="button"
        id="save-auth"
        style="margin-top: 8px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #0f172a; color: #fff; font-size: 12px; cursor: pointer;"
      >
        Save API settings
      </button>
      <div id="auth-status" class="status" style="margin-top: 6px;"></div>
    </div>

    <button type="button" id="view-captures" class="view-captures">
      View Captures
    </button>

    <div class="field" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e0e0e0;">
      <span class="label">Sites MindLoom may click on</span>
      <p class="site-empty" style="margin: 0 0 6px">
        When you run a Skill File, MindLoom only opens and clicks on these sites.
      </p>
      <div id="run-sites"></div>
    </div>
    <style>
      .site-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 12px; word-break: break-all; }
      .site-row button { flex-shrink: 0; font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
      .site-empty { font-size: 12px; color: #666; }
    </style>
    <script src="popup.js"></script>
  </body>
</html>
