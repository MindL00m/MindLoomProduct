server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate the shell so UI updates are not stuck behind browser cache.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # React Router handles application routes in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
