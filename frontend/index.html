<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Brain</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --panel: #fafafa;
    --green: #1f9d55;
    --amber: #c77700;
    --red: #c0392b;
    --blue: #2b6cb0;
    --purple: #7c3aed;
    --grey: #888888;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 15px;
    line-height: 1.45;
  }

  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
  }

  .columns {
    display: flex;
    gap: 24px;
    padding: 24px;
    align-items: stretch;
    height: calc(100vh - 75px);
  }
  .col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .col h2 {
    margin: 0;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .col-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  /* Upload */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.dragover {
    border-color: var(--text);
    background: var(--panel);
  }
  .dropzone .filename {
    color: var(--text);
    font-weight: 600;
    margin-top: 6px;
    word-break: break-all;
  }

  .field { margin-top: 12px; }
  label.lbl {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type="text"], select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }

  button {
    font: inherit;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--text);
    color: #fff;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .status { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 18px; }
  .status.error { color: var(--red); }
  .status.ok { color: var(--green); }

  .divider {
    margin: 20px 0 12px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  /* Conversations list */
  .conv-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .conv-title { font-weight: 600; word-break: break-word; }
  .conv-meta { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    text-transform: lowercase;
  }
  .badge.whatsapp { background: var(--green); }
  .badge.teams { background: var(--blue); }
  .badge.slack { background: var(--purple); }
  .badge.other { background: var(--grey); }

  /* Chat */
  #chat-col .col-body { display: flex; flex-direction: column; padding: 0; }
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-user {
    align-self: flex-start;
    max-width: 90%;
    font-weight: 600;
  }
  .brain {
    align-self: stretch;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    background: var(--panel);
  }
  .brain .answer { white-space: pre-wrap; }
  .answer-row { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }

  .conf {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    text-transform: uppercase;
  }
  .conf.high { background: var(--green); }
  .conf.medium { background: var(--amber); }
  .conf.low { background: var(--red); }

  details.sources { margin-top: 10px; font-size: 14px; }
  details.sources summary { cursor: pointer; color: var(--muted); }
  .source {
    border-top: 1px solid var(--border);
    padding: 8px 0;
  }
  .source .src-meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }

  .expert {
    margin-top: 10px;
    background: #fff6e6;
    border: 1px solid #f0d79a;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .expert .name { font-weight: 700; }
  .expert .reason { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .inline-error { color: var(--red); }
  .thinking { color: var(--muted); font-style: italic; }

  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .input-area input { flex: 1; }

  @media (max-width: 760px) {
    .columns { flex-direction: column; height: auto; }
    .col { height: auto; }
    .thread { max-height: 50vh; }
  }
</style>
</head>
<body>
  <header><h1>Company Brain</h1></header>

  <div class="columns">
    <!-- LEFT: Conversations -->
    <section class="col" id="conv-col">
      <h2>Conversations</h2>
      <div class="col-body">
        <div class="dropzone" id="dropzone">
          <div>Drag &amp; drop a conversation <strong>.json</strong> file here, or click to choose</div>
          <div class="filename" id="filename"></div>
          <input type="file" id="file-input" accept="application/json,.json" hidden />
        </div>

        <div class="field">
          <label class="lbl" for="title-input">Conversation title (optional)</label>
          <input type="text" id="title-input" placeholder="e.g. Kiln Maintenance Group" />
        </div>

        <div class="field">
          <label class="lbl" for="source-select">Source</label>
          <select id="source-select">
            <option value="whatsapp">whatsapp</option>
            <option value="teams">teams</option>
            <option value="slack">slack</option>
            <option value="other">other</option>
          </select>
        </div>

        <div class="field">
          <button id="ingest-btn">Ingest</button>
        </div>

        <div class="status" id="ingest-status"></div>

        <div class="divider">Existing conversations</div>
        <div id="conv-list"></div>
      </div>
    </section>

    <!-- RIGHT: Ask the Brain -->
    <section class="col" id="chat-col">
      <h2>Ask the Brain</h2>
      <div class="col-body">
        <div class="thread" id="thread"></div>
        <div class="input-area">
          <input type="text" id="question-input" placeholder="Ask the brain anything..." />
          <button id="send-btn">Send</button>
        </div>
      </div>
    </section>
  </div>

<script>
  const API_BASE = "http://localhost:8000";

  // ---------- helpers ----------
  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatDate(value) {
    if (!value) return "unknown date";
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function sourceClass(source) {
    const s = String(source || "").toLowerCase();
    if (s.includes("whatsapp")) return "whatsapp";
    if (s.includes("teams")) return "teams";
    if (s.includes("slack")) return "slack";
    return "other";
  }

  // ---------- upload / ingest ----------
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const filenameEl = document.getElementById("filename");
  const titleInput = document.getElementById("title-input");
  const sourceSelect = document.getElementById("source-select");
  const ingestBtn = document.getElementById("ingest-btn");
  const ingestStatus = document.getElementById("ingest-status");

  let selectedFile = null;
  let pollTimer = null;

  function setSelectedFile(file) {
    selectedFile = file;
    filenameEl.textContent = file ? file.name : "";
  }

  dropzone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files[0]) setSelectedFile(fileInput.files[0]);
  });
  ["dragenter", "dragover"].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", (e) => {
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0]) setSelectedFile(files[0]);
  });

  function setStatus(text, kind) {
    ingestStatus.textContent = text;
    ingestStatus.className = "status" + (kind ? " " + kind : "");
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("Could not read the file."));
      reader.readAsText(file);
    });
  }

  async function ingest() {
    if (!selectedFile) {
      setStatus("Please choose a JSON file first.", "error");
      return;
    }

    let conversation;
    try {
      const text = await readFileAsText(selectedFile);
      conversation = JSON.parse(text);
    } catch (err) {
      setStatus("Invalid JSON file: " + err.message, "error");
      return;
    }

    // Apply the title/source controls onto the uploaded conversation.
    conversation.source = sourceSelect.value;
    if (titleInput.value.trim()) conversation.title = titleInput.value.trim();

    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    ingestBtn.disabled = true;
    setStatus("Ingesting...", "");

    try {
      const res = await fetch(API_BASE + "/ingest/conversation", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(conversation),
      });
      if (!res.ok) throw new Error("Server returned " + res.status + ": " + (await res.text()));
      const data = await res.json();
      const jobId = data.job_id;
      setStatus("Ingesting... (job_id: " + jobId + ")", "");
      pollStatus(jobId);
    } catch (err) {
      ingestBtn.disabled = false;
      setStatus("Ingestion failed: " + err.message, "error");
    }
  }

  function summariseResult(result) {
    if (!result) return "";
    const parts = [];
    const chunks = result.total_chunks;
    if (chunks != null) parts.push(chunks + " chunks");
    // People / entities are optional depending on backend version.
    const people = result.total_people ?? result.people_count ?? result.participant_count;
    if (people != null) parts.push(people + " people");
    const entities = result.total_entities ?? result.entities_count ?? result.entity_count;
    if (entities != null) parts.push(entities + " entities");
    return parts.join(", ");
  }

  async function pollStatus(jobId) {
    try {
      const res = await fetch(API_BASE + "/ingest/status/" + encodeURIComponent(jobId));
      if (!res.ok) throw new Error("Server returned " + res.status);
      const job = await res.json();

      if (job.status === "complete") {
        ingestBtn.disabled = false;
        const summary = summariseResult(job.result);
        setStatus("Done" + (summary ? " — " + summary : ""), "ok");
        loadConversations();
        return;
      }
      if (job.status === "failed") {
        ingestBtn.disabled = false;
        setStatus("Failed: " + (job.error || "unknown error"), "error");
        return;
      }
      // queued / processing -> keep polling
      const progress = job.progress ? " — " + job.progress : "";
      setStatus("Ingesting... (job_id: " + jobId + ")" + progress, "");
      pollTimer = setTimeout(() => pollStatus(jobId), 2000);
    } catch (err) {
      ingestBtn.disabled = false;
      setStatus("Lost contact with the server: " + err.message, "error");
    }
  }

  ingestBtn.addEventListener("click", ingest);

  // ---------- conversations list ----------
  const convList = document.getElementById("conv-list");

  async function loadConversations() {
    convList.innerHTML = '<div style="color:var(--muted)">Loading...</div>';
    try {
      const res = await fetch(API_BASE + "/conversations");
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      const items = Array.isArray(data) ? data : (data.conversations || []);
      renderConversations(items);
    } catch (err) {
      convList.innerHTML = '<div class="inline-error">Could not load conversations: '
        + escapeHtml(err.message) + "</div>";
    }
  }

  function renderConversations(items) {
    if (!items || items.length === 0) {
      convList.innerHTML = '<div style="color:var(--muted)">No conversations yet.</div>';
      return;
    }
    convList.innerHTML = items.map((c) => {
      const title = c.title || c.conversation_id || "(untitled)";
      const cls = sourceClass(c.source);
      const count = c.message_count != null ? c.message_count : "?";
      const date = formatDate(c.ingested_at || c.created_at);
      return (
        '<div class="conv-item">' +
          '<div class="conv-title">' + escapeHtml(title) + '</div>' +
          '<div class="conv-meta">' +
            '<span class="badge ' + cls + '">' + escapeHtml(c.source || "other") + '</span>' +
            '<span>' + escapeHtml(count) + ' messages</span>' +
            '<span>' + escapeHtml(date) + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  // ---------- chat ----------
  const thread = document.getElementById("thread");
  const questionInput = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");

  function scrollThread() { thread.scrollTop = thread.scrollHeight; }

  function addUserMessage(text) {
    const el = document.createElement("div");
    el.className = "msg-user";
    el.textContent = text;
    thread.appendChild(el);
    scrollThread();
  }

  function addPlaceholder() {
    const el = document.createElement("div");
    el.className = "brain";
    el.innerHTML = '<div class="thinking">Thinking...</div>';
    thread.appendChild(el);
    scrollThread();
    return el;
  }

  function renderResponse(el, data) {
    const conf = String(data.confidence || "").toLowerCase();
    const sources = Array.isArray(data.sources) ? data.sources : [];

    let html = '<div class="answer-row">' +
      '<div class="answer">' + escapeHtml(data.answer || "") + '</div>';
    if (conf) html += '<span class="conf ' + escapeHtml(conf) + '">' + escapeHtml(conf) + '</span>';
    html += '</div>';

    if (sources.length) {
      html += '<details class="sources"><summary>Sources (' + sources.length + ' chunks)</summary>';
      html += sources.map((s) => {
        const speakers = Array.isArray(s.speakers) ? s.speakers.join(", ") : (s.speakers || "");
        return '<div class="source">' +
          '<div class="src-meta">' + escapeHtml(speakers) + ' &middot; ' + escapeHtml(formatDate(s.start_time)) + '</div>' +
          '<div>' + escapeHtml(s.summary || "") + '</div>' +
        '</div>';
      }).join("");
      html += '</details>';
    }

    if (data.routed && data.expert) {
      html += '<div class="expert">' +
        '<div class="name">Suggested expert: ' + escapeHtml(data.expert.name || "") + '</div>' +
        '<div class="reason">' + escapeHtml(data.expert.reason || "") + '</div>' +
      '</div>';
    }

    el.innerHTML = html;
    scrollThread();
  }

  async function send() {
    const question = questionInput.value.trim();
    if (!question) return;
    addUserMessage(question);
    questionInput.value = "";
    const placeholder = addPlaceholder();

    try {
      const res = await fetch(API_BASE + "/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question }),
      });
      if (!res.ok) throw new Error("Server returned " + res.status + ": " + (await res.text()));
      const data = await res.json();
      renderResponse(placeholder, data);
    } catch (err) {
      placeholder.innerHTML = '<div class="inline-error">Could not get an answer: '
        + escapeHtml(err.message) + "</div>";
      scrollThread();
    }
  }

  sendBtn.addEventListener("click", send);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  });

  // ---------- init ----------
  loadConversations();
</script>
</body>
</html>
